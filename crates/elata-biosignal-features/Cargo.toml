[package]
name = "elata-biosignal-features"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
description = "Windowed biosignal feature extraction (Welch PSD, EEG band powers, Hjorth, quality flags)"
license = "MIT"
repository = "https://github.com/Elata-Biosciences/elata-bio-sdk"
homepage = "https://github.com/Elata-Biosciences/elata-bio-sdk#readme"
readme = "README.md"
publish = false

[dependencies]
elata-eeg-signal = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
serde_json = "1.0"
